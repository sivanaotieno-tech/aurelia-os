
services:
  db:
    image: postgres:15-alpine
    container_name: messaging_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: messaging_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile
    container_name: messaging_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgrespassword@db:5432/messaging_app
      JWT_SECRET: supersecretkey
    depends_on:
      - db

volumes:
  pgdata:

