[package]
name = "ev-assistant"
version = "1.0.0"
description = "E.V. — Enhanced Voice local-first Windows desktop assistant"
authors = ["E.V. Project"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "ev_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
