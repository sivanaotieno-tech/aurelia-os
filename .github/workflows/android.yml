name: Build & Publish Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

jobs:
  Gradle:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: setup jdk
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install JavaScript dependencies
      run: npm ci
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
    - name: Build Release APK
      working-directory: android
      run: gradle --no-daemon assembleRelease
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: aurelia-os-release-apk
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 14
    - name: Publish APK to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" android/app/build/outputs/apk/release/*.apk --title "Aurelia OS ${GITHUB_REF_NAME}" --generate-notes
